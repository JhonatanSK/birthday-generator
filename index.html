<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerador de Parabens</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="card card--center">
      <header class="card__header">
        <div class="badge">🎂</div>
        <h1>Gerador de Parabens</h1>
        <p class="muted">Crie um link personalizado em segundos.</p>
      </header>

      <form id="generator-form" class="form">
        <label class="field">
          <span>Nome do aniversariante</span>
          <input id="nome" name="nome" type="text" placeholder="Ex: Ana" required />
        </label>

        <label class="field">
          <span>Seu nome (opcional)</span>
          <input id="de" name="de" type="text" placeholder="Ex: Joao" />
        </label>

        <label class="field">
          <span>ID do video do YouTube (opcional)</span>
          <input id="v" name="v" type="text" placeholder="Ex: XXXX" />
          <small class="hint">Ex: no link https://www.youtube.com/watch?v=XXXX o ID e XXXX</small>
        </label>

        <label class="field">
          <span>Limite de memes (opcional)</span>
          <input id="m" name="m" type="number" min="1" placeholder="Ex: 6" />
          <small class="hint">Quantidade maxima de memes para sortear da lista padrao.</small>
        </label>

        <button class="btn btn--primary" type="submit">Gerar link</button>
      </form>

      <div id="result" class="result hidden">
        <label class="field">
          <span>Seu link:</span>
          <input id="result-link" type="text" readonly />
        </label>

        <div class="actions">
          <button id="copy-link" class="btn" type="button">🔗 Copiar link</button>
          <a id="open-link" class="btn btn--ghost" href="#">🚀 Abrir pagina</a>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>
